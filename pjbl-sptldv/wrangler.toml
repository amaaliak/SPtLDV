# =====================================================================
# Cloudflare Pages + Pages Functions (backend Worker di functions/api)
# Deploy:  npm run deploy
# =====================================================================
name = "pjbl-sptldv"
compatibility_date = "2024-12-18"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = "dist"

# ---------------------------- D1 (SQLite) ----------------------------
# Buat dulu:  npx wrangler d1 create pjbl-sptldv-db
# Lalu salin database_id hasilnya ke bawah ini.
[[d1_databases]]
binding = "DB"
database_name = "pjbl-sptldv-db"
database_id = "xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx"

# ------------------------- R2 (penyimpanan file) ---------------------
# Buat dulu:  npx wrangler r2 bucket create pjbl-sptldv-files
[[r2_buckets]]
binding = "R2"
bucket_name = "pjbl-sptldv-files"

[vars]
NAMA_APLIKASI = "PjBL SPtLDV — Tata Boga"
ZONA_WAKTU = "Asia/Jakarta"

# Lingkungan pratinjau (preview) Pages
[env.preview]
[[env.preview.d1_databases]]
binding = "DB"
database_name = "pjbl-sptldv-db-preview"
database_id = "xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx"

[[env.preview.r2_buckets]]
binding = "R2"
bucket_name = "pjbl-sptldv-files-preview"
